[project]
name = "textdistance-er-demo-backend"
version = "0.1.0"
description = "FastAPI backend for textdistance Entity Resolution demo"
authors = [
    {name = "kazimianec",email = "a.kazimianec@gmail.com"}
]
requires-python = "^3.12"
dependencies = [
    "fastapi (>=0.115.0)",
    "uvicorn (>=0.30.0)",
    "textdistance (>=4.6.0)",
    "pydantic (>=2.0.0)",
    # textdistance implements Needleman-Wunsch and Gotoh only when numpy is
    # importable, and raises ImportError otherwise. Without this the two
    # alignment metrics silently reported 0% similarity.
    "numpy (>=1.26.0)",
]


[dependency-groups]
# pytest was never declared as a dependency, so it only worked locally
# because a global pyenv install happened to shadow it. A clean `poetry
# install` produced an environment with no pytest at all.
dev = [
    "pytest (>=8.0.0)",
    "httpx (>=0.28.0)",
]


[tool.poetry]
# The backend lives in src/app, but the distribution name is
# "textdistance-er-demo-backend", so Poetry cannot infer the package folder
# from the project name. Without this, `poetry install` fails with
# "No file/folder found for package textdistance-er-demo-backend".
packages = [{ include = "app", from = "src" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
